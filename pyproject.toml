[project]
name = "local-rag-mcp"
version = "0.1.0"
description = "Local RAG/MCP assistant: FAISS retrieval pipeline with FastMCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies
    "ollama>=0.6.2",
    "sentence-transformers>=6.0.0",
    "faiss-cpu>=1.15.0",
    "numpy>=2.5.2",
    "tiktoken>=0.14.0",
    "requests>=2.34.2",
    # Hybrid search (BM25 in memory, ADR-0002)
    "rank-bm25>=0.2.2",
    # Document processing
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    # MCP
    "fastmcp>=3.4.7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
# Pure-seam unit tests (issue #14). Paths are relative to the repository
# root (the rootdir), so `uv run pytest` works from the root and from src/;
# `pythonpath` makes the src-run imports (`rag.*`, `config`) resolvable.
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle errors (ruff default)
    "E7",
    "E9",
    "F",   # pyflakes (ruff default)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ty]
# Type checking runs in ratchet mode.
# Baseline (2026-08-30, ty pinned by uv.lock): `uv run ty check src`
# passes with 0 diagnostics.
# Policy (fix or narrowly scoped justified ignores; no global rule
# disables) is documented in src/COMMANDS.md, "Development Checks".

[tool.uv]
# Non-package mode: uv manages the environment and the lock only;
# the code is not installed as a package (convention: run from src/).
package = false
