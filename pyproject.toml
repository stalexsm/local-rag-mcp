[project]
name = "local-rag-mcp"
version = "0.1.0"
description = "Local RAG/MCP assistant: FAISS retrieval pipeline with FastMCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies
    "ollama>=0.1.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "tiktoken>=0.5.0",
    "requests>=2.31.0",
    # Document processing
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "rich>=14.2.0",
    # MCP
    "fastmcp>=0.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1",
]

[tool.uv]
# Non-package mode: uv manages the environment and the lock only;
# the code is not installed as a package (convention: run from src/).
package = false
